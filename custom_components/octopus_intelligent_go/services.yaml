start_immediate_charge:
  name: Start charging now
  description: Ask Octopus to start charging one configured Intelligent Go device immediately.
  fields:
    device_id:
      required: true
      name: Device
      description: The Home Assistant device to control. Raw Kraken / SmartFlex device IDs are also accepted in YAML.
      selector:
        device:
          integration: octopus_intelligent_go

cancel_immediate_charge:
  name: Stop charging
  description: Ask Octopus to stop immediate charging for one configured Intelligent Go device.
  fields:
    device_id:
      required: true
      name: Device
      description: The Home Assistant device to control. Raw Kraken / SmartFlex device IDs are also accepted in YAML.
      selector:
        device:
          integration: octopus_intelligent_go
